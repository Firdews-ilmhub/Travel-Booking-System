<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./fontawesome-free-5.15.4-web/css/all.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <i class="fas fa-bars menu-toggle" id="menu-toggle"></i>
            <ul id="navigation">
                <li class="logo">ETHIOPIA</li>
                <li><a href="home.html">Home</a></li>
                <li><a href="destination.html">Destination</a></li>
                <li><a href="booking.html">Booking</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="heading-book">
            <span>C</span>
            <span>O</span>
            <span>N</span>
            <span>T</span>
            <span>A</span>
            <span>C</span>
            <span>T</span>
        </h1>
        <div class="contact-icons">
            <div><i class="fas fa-phone"></i>+251-912-345-678</div>
            <div><i class="fas fa-envelope"></i>Ethiovist@gmail.com</div>
            <div><i class="fas fa-map-marker-alt"></i>Addis Ababa, Ethiopia</div>
        </div>
        <div class="contact-form">
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Feedback</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <div class="button-contact">
                    <button type="submit">Send Message</button>
                    <button type="reset" value="reset">Reset</button>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <p>&copy;2026 Travel Ethiopia. All rights reserved</p>
        <ul class="social-media">
            <li><i class="fab fa-instagram"></i></li>
            <li><i class="fab fa-facebook-f"></i></li>
            <li><i class="fab fa-telegram"></i></li>
            <li><i class="fab fa-whatsapp"></i></li>
        </ul>
    </footer>
    <script src="script.js"></script>
</body>

</html>
